{% extends 'base_raw.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/doctor-dashboard.css' %}">
<main class="doctor-shell">
  <div class="container py-5">
    <div class="doctor-login-card mx-auto">
      <div class="doctor-login-mark"><i class="bi bi-heart-pulse-fill"></i></div>
      <p class="doctor-eyebrow">SmartScreening</p>
      <h1>{{ labels.login_title }}</h1>
      {% if messages %}{% for message in messages %}<div class="alert alert-danger">{{ message }}</div>{% endfor %}{% endif %}
      <form method="post" novalidate>
        {% csrf_token %}
        <label class="form-label" for="username">{{ labels.username }}</label>
        <input class="form-control form-control-lg mb-3" id="username" name="username" autocomplete="username" required>
        <label class="form-label" for="password">{{ labels.password }}</label>
        <input class="form-control form-control-lg mb-4" id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="btn btn-primary btn-lg w-100" type="submit">{{ labels.login }} <i class="bi bi-arrow-right-short"></i></button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
