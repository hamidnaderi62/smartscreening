{% extends 'pedigree/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center">شجره خانوادگی سرطان</h1>
    
    <div class="card mt-4">
        <div class="card-header">
            <h2>نمایش گرافیکی شجره</h2>
        </div>
        <div class="card-body text-center">
            <!-- Display the pedigree image -->
            <img src="data:image/png;base64,{{ pedigree_image }}" 
                 alt="شجره خانوادگی" 
                 class="img-fluid"
                 style="max-width: 100%; height: auto;">
        </div>
    </div>

    <div class="mt-3 text-center">
        <a href="data:image/png;base64,{{ pedigree_image }}"
           download="family_pedigree.png"
           class="btn btn-success">
            دانلود تصویر
        </a>
    </div>

    <div class="mt-4 text-center">
        <a href="{% url 'pedigree:index_fa' %}" class="btn btn-primary">
            بازگشت به صفحه اصلی
        </a>
    </div>
</div>
{% endblock %}
