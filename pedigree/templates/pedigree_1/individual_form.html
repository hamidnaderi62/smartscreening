{% extends 'base.html' %}

{% block content %}
<h1>
    {% if edit_mode %}Edit{% else %}Add{% endif %} Individual to {{ family.name }}
</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'family_detail' family_id=family.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
