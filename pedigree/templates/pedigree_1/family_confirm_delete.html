{% extends 'base.html' %}

{% block content %}
<h1>Confirm Deletion</h1>
<p>Are you sure you want to delete the family "{{ family.name }}"?</p>
<p>This will also delete all associated individuals.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'pedigree:family_detail' family_id=family.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
