services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DJANGO_DB_NAME}
      POSTGRES_USER: ${DJANGO_DB_USER}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: smartscreening.settings_production
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_HOST: db
      DJANGO_RUN_MIGRATIONS: "1"
      DJANGO_COLLECTSTATIC: "1"
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  followup_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: smartscreening.settings_production
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_HOST: db
      DJANGO_RUN_MIGRATIONS: "0"
      DJANGO_COLLECTSTATIC: "0"
    command: ["sh", "-c", "while true; do python manage.py process_followups --limit 100; sleep $${FOLLOWUP_INTERVAL_SECONDS:-300}; done"]
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
